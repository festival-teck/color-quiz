<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>これは何色？</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #201f1d;
    --ink-soft: #514f49;
    --paper: #faf9f6;
    --panel: #ffffff;
    --line: #e4e1d9;
    --accent: #2b3a67;
    --accent-ink: #ffffff;
    --good: #2e7d32;
    --bad: #b3261e;
    --bad-bg: #fdecea;
    --good-bg: #eaf5ea;
    box-sizing: border-box;
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --ink: #f1efe9;
      --ink-soft: #b9b6ad;
      --paper: #17171a;
      --panel: #201f23;
      --line: #34333a;
      --accent: #7c8fd6;
      --accent-ink: #14141c;
      --good: #7fd08a;
      --bad: #ff8a80;
      --bad-bg: #3a1f1e;
      --good-bg: #1c3220;
    }
  }
  :root[data-theme="dark"] {
    --ink: #f1efe9;
    --ink-soft: #b9b6ad;
    --paper: #17171a;
    --panel: #201f23;
    --line: #34333a;
    --accent: #7c8fd6;
    --accent-ink: #14141c;
    --good: #7fd08a;
    --bad: #ff8a80;
    --bad-bg: #3a1f1e;
    --good-bg: #1c3220;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    overflow-x: hidden;
  }

  html { scroll-padding-top: env(safe-area-inset-top, 0px); }

  button, input {
    font-family: inherit;
  }

  .view {
    display: none;
    min-height: 100svh;
    width: 100%;
    flex-direction: column;
    align-items: center;
  }
  .view.active { display: flex; }

  /* ---------- Title view ---------- */

  #view-title {
    position: relative;
    justify-content: center;
    padding: 32px 20px 48px;
    overflow: hidden;
  }

  .splash {
    position: absolute;
    inset: 0;
    z-index: 0;
    overflow: hidden;
  }
  .splash svg { width: 100%; height: 100%; }
  .blob {
    filter: blur(28px);
    opacity: 0.5;
  }
  @media (prefers-color-scheme: dark) {
    .blob { opacity: 0.35; }
  }
  :root[data-theme="dark"] .blob { opacity: 0.35; }

  .title-inner {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .title-controls {
    position: absolute;
    top: calc(env(safe-area-inset-top, 0px) + 16px);
    right: 16px;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .lang-toggle {
    background: var(--panel);
    border: 1.5px solid var(--line);
    color: var(--ink-soft);
    font-size: 0.78rem;
    font-weight: 700;
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .lang-toggle:active { transform: scale(0.96); }

  .icon-toggle {
    background: var(--panel);
    border: 1.5px solid var(--line);
    color: var(--ink-soft);
    font-size: 0.95rem;
    line-height: 1;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  .icon-toggle:active { transform: scale(0.96); }

  h1.game-title {
    font-size: clamp(2rem, 9vw, 2.6rem);
    font-weight: 900;
    margin: 0 0 6px;
    text-align: center;
    letter-spacing: 0.02em;
  }

  .game-sub {
    color: var(--ink-soft);
    font-size: 0.95rem;
    margin: 0 0 28px;
    text-align: center;
    font-weight: 500;
  }

  .level-list {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .site-footer {
    width: 100%;
    margin-top: 22px;
    text-align: center;
    font-size: 0.78rem;
    color: var(--ink-soft);
  }
  .site-footer a {
    color: var(--ink-soft);
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .site-footer a:hover { color: var(--ink); }
  .footer-sep { margin: 0 6px; }

  .level-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 16px 18px;
    text-align: left;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 10px;
    box-shadow: 0 1px 0 rgba(0,0,0,0.03);
    transition: transform 0.15s ease, border-color 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .level-card:active { transform: scale(0.98); }
  .level-card:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }
  .level-card:hover { border-color: var(--accent); }

  .level-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
  }

  .level-name {
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--ink);
  }

  .level-desc {
    font-size: 0.82rem;
    color: var(--ink-soft);
    font-weight: 500;
  }

  .swatch-row {
    display: flex;
    gap: 8px;
  }

  .swatch {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    border: 1px solid rgba(0,0,0,0.08);
    flex-shrink: 0;
  }

  /* ---------- Quiz view ---------- */

  #view-quiz {
    justify-content: center;
    padding: 20px 20px 40px;
  }

  .quiz-inner {
    width: 100%;
    max-width: 380px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .quiz-topbar {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 22px;
  }

  .back-link {
    background: none;
    border: none;
    color: var(--ink-soft);
    font-size: 1.02rem;
    font-weight: 700;
    padding: 6px 0;
    cursor: pointer;
  }

  .progress-text {
    font-size: 1.02rem;
    font-weight: 700;
    color: var(--ink-soft);
  }

  .color-square {
    position: relative;
    width: min(58vw, 220px);
    height: min(58vw, 220px);
    border-radius: 20px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    margin-bottom: 22px;
    transition: transform 0.12s ease;
  }

  .square-label {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    background: rgba(0,0,0,0.62);
    color: #fff;
    padding: 8px 16px;
    border-radius: 12px;
    pointer-events: none;
    max-width: 92%;
    text-align: center;
    white-space: nowrap;
  }
  .square-label.show { display: flex; }
  .square-label .sl-hex {
    font-family: 'SFMono-Regular', Consolas, Menlo, monospace;
    font-weight: 900;
    font-size: 1rem;
    letter-spacing: 0.03em;
  }
  .square-label .sl-name {
    font-size: 0.7rem;
    font-weight: 700;
  }
  .color-square.shake {
    animation: shake 0.35s ease;
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  .question-text {
    font-size: 1.1rem;
    font-weight: 700;
    margin-bottom: 18px;
  }

  .choices {
    width: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 16px;
  }

  .choice-btn {
    padding: 14px 10px;
    border-radius: 14px;
    border: 1.5px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.1s ease, border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
  }
  .choice-btn:active { transform: scale(0.97); }
  .choice-btn:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }
  .choice-btn:disabled { cursor: default; }

  .choice-btn.is-correct {
    background: var(--good-bg);
    border-color: var(--good);
    color: var(--good);
  }
  .choice-btn.is-wrong {
    background: var(--bad-bg);
    border-color: var(--bad);
    color: var(--bad);
  }

  .choice-btn.choice-hex {
    font-family: 'SFMono-Regular', Consolas, Menlo, monospace;
    letter-spacing: 0.03em;
    font-size: 0.9rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
  }

  .choice-text-mark {
    font-weight: 900;
  }

  .choice-btn.choice-swatch {
    position: relative;
    padding: 0;
    aspect-ratio: 1;
    overflow: hidden;
  }

  .choice-reveal {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
  }

  .choice-mark {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: rgba(255,255,255,0.94);
    color: #1a1a1a;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    font-weight: 900;
    box-shadow: 0 2px 6px rgba(0,0,0,0.28);
  }

  .choice-info {
    display: flex;
    flex-direction: column;
    align-items: center;
    background: rgba(0,0,0,0.6);
    color: #fff;
    padding: 4px 10px;
    border-radius: 8px;
    line-height: 1.35;
    white-space: nowrap;
  }
  .choice-info-hex {
    font-family: 'SFMono-Regular', Consolas, Menlo, monospace;
    font-weight: 800;
    font-size: 0.68rem;
    letter-spacing: 0.02em;
  }
  .choice-info-name {
    font-size: 0.6rem;
    font-weight: 600;
  }

  .hint-btn {
    background: none;
    border: 1.5px dashed var(--line);
    color: var(--ink-soft);
    font-size: 0.8rem;
    font-weight: 700;
    border-radius: 10px;
    padding: 7px 14px;
    cursor: pointer;
    margin-bottom: 12px;
    display: none;
    -webkit-tap-highlight-color: transparent;
  }
  .hint-btn:active { transform: scale(0.97); }

  .hint-text {
    width: 100%;
    font-size: 0.8rem;
    color: var(--ink-soft);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px 12px;
    margin: -4px 0 14px;
    line-height: 1.6;
    display: none;
    white-space: pre-line;
    font-weight: 500;
  }
  .hint-text.show { display: block; }

  .hint-map {
    display: flex;
    gap: 6px;
    margin-bottom: 8px;
  }
  .hint-map-chip {
    flex: 1;
    min-width: 0;
    border-radius: 10px;
    padding: 6px 4px;
    text-align: center;
    color: #fff;
  }
  .hint-map-chip .pos {
    display: block;
    font-family: 'SFMono-Regular', Consolas, Menlo, monospace;
    font-size: 0.68rem;
    font-weight: 800;
    opacity: 0.9;
    margin-bottom: 2px;
  }
  .hint-map-chip .val {
    display: block;
    font-size: 0.76rem;
    font-weight: 800;
  }
  .hint-map-chip.chip-r { background: #c0392b; }
  .hint-map-chip.chip-g { background: #2e7d32; }
  .hint-map-chip.chip-b { background: #2955a3; }

  .hint-legend {
    font-size: 0.74rem;
    line-height: 1.6;
  }

  .feedback {
    min-height: 52px;
    width: 100%;
    text-align: center;
    font-size: 0.95rem;
    font-weight: 700;
    border-radius: 14px;
    padding: 10px 14px;
    visibility: hidden;
  }
  .feedback.show { visibility: visible; }
  .feedback.good { color: var(--good); background: var(--good-bg); }
  .feedback.bad { color: var(--bad); background: var(--bad-bg); }

  /* ---------- Explanation panel (shown after a correct answer) ---------- */

  .explain-panel {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 18px 20px;
    margin-top: 4px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    animation: rise 0.25s ease;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .explain-head {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .explain-chip {
    width: 22px;
    height: 22px;
    border-radius: 7px;
    flex-shrink: 0;
    border: 1px solid rgba(0,0,0,0.08);
  }

  .explain-name {
    font-size: 1.05rem;
    font-weight: 700;
  }

  .explain-hex {
    font-family: 'SFMono-Regular', Consolas, Menlo, monospace;
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--ink-soft);
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 3px 8px;
    letter-spacing: 0.02em;
  }

  .explain-text {
    font-size: 0.88rem;
    line-height: 1.7;
    color: var(--ink-soft);
    font-weight: 500;
    margin: 0;
    white-space: pre-line;
  }

  .explain-options {
    display: none;
    flex-direction: column;
    gap: 8px;
  }
  .explain-options.show { display: flex; }

  .explain-option {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--paper);
  }
  .explain-option.is-correct-opt {
    border-color: var(--good);
    background: var(--good-bg);
  }
  .explain-option-chip {
    width: 22px;
    height: 22px;
    border-radius: 6px;
    flex-shrink: 0;
    border: 1px solid rgba(0,0,0,0.08);
  }
  .explain-option-hex {
    font-family: 'SFMono-Regular', Consolas, Menlo, monospace;
    font-size: 0.82rem;
    font-weight: 700;
    flex-shrink: 0;
  }
  .explain-option-name {
    font-size: 0.76rem;
    color: var(--ink-soft);
    font-weight: 500;
  }

  .explain-next {
    align-self: stretch;
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    border-radius: 12px;
    padding: 12px;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    margin-top: 4px;
  }
  .explain-next:active { transform: scale(0.98); }
  .explain-next:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }

  /* ---------- Result view ---------- */

  #view-result {
    justify-content: center;
    padding: 32px 20px 48px;
  }

  .result-inner {
    width: 100%;
    max-width: 380px;
    text-align: center;
  }

  .result-title {
    font-size: 1.6rem;
    font-weight: 900;
    margin-bottom: 18px;
  }

  .result-stats {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 22px;
  }

  .stat-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.95rem;
    font-weight: 500;
    color: var(--ink-soft);
    padding: 6px 0;
  }
  .stat-row strong {
    color: var(--ink);
    font-weight: 700;
  }
  .stat-row + .stat-row {
    border-top: 1px solid var(--line);
  }

  .result-actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .btn-primary, .btn-secondary {
    padding: 14px 20px;
    border-radius: 14px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    border: none;
  }
  .btn-primary {
    background: var(--accent);
    color: var(--accent-ink);
  }
  .btn-secondary {
    background: transparent;
    color: var(--ink-soft);
    border: 1.5px solid var(--line);
  }
  .btn-primary:active, .btn-secondary:active { transform: scale(0.98); }

  .btn-share {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .x-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 20px;
    border-radius: 5px;
    background: #000;
    color: #fff;
    font-size: 0.72rem;
    font-weight: 700;
    flex-shrink: 0;
  }
  @media (prefers-color-scheme: dark) {
    .x-icon { background: #fff; color: #000; }
  }
  :root[data-theme="dark"] .x-icon { background: #fff; color: #000; }

  /* ---------- Larger screens (tablet / desktop) ---------- */

  @media (min-width: 640px) {
    .title-inner, .quiz-inner, .result-inner { max-width: 480px; }

    h1.game-title { font-size: clamp(2rem, 5vw, 3rem); }
    .game-sub { font-size: 1.05rem; margin-bottom: 34px; }

    .back-link, .progress-text { font-size: 1.15rem; }

    .level-card { padding: 20px 24px; gap: 12px; }
    .level-name { font-size: 1.3rem; }
    .level-desc { font-size: 0.9rem; }
    .swatch { width: 32px; height: 32px; }

    .color-square { width: min(34vw, 280px); height: min(34vw, 280px); margin-bottom: 28px; }
    .question-text { font-size: 1.25rem; margin-bottom: 22px; }

    .choice-btn { padding: 17px 12px; font-size: 1.05rem; border-radius: 16px; }
    .choice-btn.choice-hex { font-size: 1rem; }
    .choices { gap: 12px; margin-bottom: 20px; }

    .feedback { font-size: 1.05rem; min-height: 56px; }

    .explain-panel { padding: 22px 24px; gap: 12px; }
    .explain-chip { width: 26px; height: 26px; }
    .explain-hex { font-size: 0.85rem; padding: 4px 10px; }
    .explain-name { font-size: 1.2rem; }
    .explain-text { font-size: 0.95rem; }
    .explain-next { font-size: 0.95rem; padding: 14px; }

    .result-title { font-size: 1.9rem; }
    .result-stats { padding: 24px; }
    .stat-row { font-size: 1.05rem; }
    .btn-primary, .btn-secondary { font-size: 1rem; padding: 16px 22px; }
  }

  @media (min-width: 1024px) {
    .title-inner, .quiz-inner, .result-inner { max-width: 540px; }
    h1.game-title { font-size: clamp(2rem, 4vw, 3.4rem); }
    .color-square { width: min(26vw, 320px); height: min(26vw, 320px); }
  }
</style>
</head>
<body>

<div id="view-title" class="view active">
  <div class="splash" aria-hidden="true">
    <svg viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice">
      <circle class="blob" cx="60" cy="90" r="110" fill="#e53935"/>
      <circle class="blob" cx="340" cy="160" r="90" fill="#1e88e5"/>
      <circle class="blob" cx="90" cy="620" r="130" fill="#fdd835"/>
      <circle class="blob" cx="330" cy="680" r="100" fill="#8e24aa"/>
      <circle class="blob" cx="200" cy="400" r="140" fill="#43a047"/>
      <circle class="blob" cx="20" cy="380" r="70" fill="#fb8c00"/>
    </svg>
  </div>
  <div class="title-controls">
    <button class="icon-toggle" id="mute-toggle" type="button" aria-label="Mute sound effects">🔊</button>
    <button class="lang-toggle" id="lang-toggle" type="button">EN</button>
  </div>
  <div class="title-inner">
    <h1 class="game-title" id="game-title">これは何色？</h1>
    <p class="game-sub" id="game-sub">正方形の色を当てるだけのシンプルなゲーム</p>
    <div class="level-list" id="level-list"></div>
    <div class="site-footer">
      <a id="footer-privacy" href="privacy.html">プライバシーポリシー</a>
      <span class="footer-sep" aria-hidden="true">・</span>
      <a id="footer-about" href="about.html">運営者情報</a>
    </div>
  </div>
</div>

<div id="view-quiz" class="view">
  <div class="quiz-inner">
    <div class="quiz-topbar">
      <button class="back-link" id="quit-btn" type="button">← レベル選択</button>
      <span class="progress-text" id="progress-text"></span>
    </div>
    <div class="color-square" id="color-square">
      <span class="square-label" id="square-label">
        <span class="sl-hex" id="sl-hex"></span>
        <span class="sl-name" id="sl-name"></span>
      </span>

  var audioCtx = null;
  function getAudioCtx() {
    if (audioCtx) return audioCtx;
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) {
      audioCtx = null;
    }

  function playTone(freq, startTime, duration, type, gainPeak) {
    var ctx = getAudioCtx();
    if (!ctx) return;
    if (ctx.state === "suspended") { ctx.resume(); }
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = type || "sine";
    osc.frequency.value = freq;
    var t0 = ctx.currentTime + startTime;
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.linearRampToValueAtTime(gainPeak, t0 + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + duration + 0.03);
  }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function buildChoices(levelKey, correctColor) {
    var pool = LEVELS[levelKey].colors.filter(function (c) { return c.hex !== correctColor.hex; });
    var distractors = shuffle(pool).slice(0, 3);
    return shuffle(distractors.concat([correctColor]));
  }

  function randomChannel() {
    return Math.floor(Math.random() * 256);
  }

  function rgbToHex(r, g, b) {
    return "#" + [r, g, b].map(function (v) {
      var s = v.toString(16).toUpperCase();
      return s.length < 2 ? "0" + s : s;
    }).join("");
  }

  function hexToRgb(hex) {
    var h = hex.replace("#", "");
    var num = parseInt(h, 16);
    return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
  }

  function generateRandomColor() {
    var r = randomChannel(), g = randomChannel(), b = randomChannel();
    return { hex: rgbToHex(r, g, b) };
  }

  function clamp255(v) {
    return Math.max(0, Math.min(255, v));
  }

  function jitterRgb(rgb, minMag, maxMag) {
    var out = { r: rgb.r, g: rgb.g, b: rgb.b };
    ["r", "g", "b"].forEach(function (c) {
      if (Math.random() < 0.85) {
        var mag = minMag + Math.random() * (maxMag - minMag);
        var sign = Math.random() < 0.5 ? -1 : 1;
        out[c] = clamp255(Math.round(out[c] + sign * mag));
      }
    });
    return out;
  }

  function rgbEqual(a, b) {
    return a.r === b.r && a.g === b.g && a.b === b.b;
  }

  function generateDistinctVariants(baseRgb, minMag, maxMag, n) {
    var set = [];
    var guard = 0;
    while (set.length < n && guard < 300) {
      guard++;
      var cand = jitterRgb(baseRgb, minMag, maxMag);
      if (rgbEqual(cand, baseRgb)) continue;
      if (set.some(function (s) { return rgbEqual(s, cand); })) continue;
      set.push(cand);
    }
    return set;
  }

    var distractors = generateDistinctVariants(baseRgb, 25, 70, 3);
    var target = { hex: rgbToHex(baseRgb.r, baseRgb.g, baseRgb.b) };
    var options = distractors.map(function (rgb) { return { hex: rgbToHex(rgb.r, rgb.g, rgb.b) }; });
    options.push(target);
    return { target: target, options: shuffle(options) };
  }

  function randomBrightChannel() {
    // Keep the base tone light-to-mid so a small jitter reads as "barely different"
    // instead of a different hue entirely (very dark bases exaggerate small shifts).
    return Math.floor(120 + Math.random() * 136);
  }

  function generateSwatchQuestion() {
    var baseRgb = { r: randomBrightChannel(), g: randomBrightChannel(), b: randomBrightChannel() };
    var distractors = generateDistinctVariants(baseRgb, 3, 12, 3);
    var target = { hex: rgbToHex(baseRgb.r, baseRgb.g, baseRgb.b) };
    var options = distractors.map(function (rgb) { return { hex: rgbToHex(rgb.r, rgb.g, rgb.b) }; });
    options.push(target);
    return { target: target, options: shuffle(options) };
  }

  var NAMED_INDEX = [];
  ["beginner", "intermediate", "advanced"].forEach(function (k) {
    LEVELS[k].colors.forEach(function (c) {
      NAMED_INDEX.push(c);
    });
  });

  function nearestColorName(hex) {
    var rgb = hexToRgb(hex);
    var best = null, bestDist = Infinity;
    NAMED_INDEX.forEach(function (c) {
      var crgb = hexToRgb(c.hex);
      var dr = rgb.r - crgb.r, dg = rgb.g - crgb.g, db = rgb.b - crgb.b;
      var d = dr * dr + dg * dg + db * db;
      if (d < bestDist) { bestDist = d; best = c; }
    });
    return best;
  }

  function relativeDescriptor(opt, target, s) {
    var a = hexToRgb(opt.hex), b = hexToRgb(target.hex);
    var dr = a.r - b.r, dg = a.g - b.g, db = a.b - b.b;
    var avg = (dr + dg + db) / 3;
    var spread = Math.max(Math.abs(dr - avg), Math.abs(dg - avg), Math.abs(db - avg));
    if (spread < 4) {
      var bMag = Math.abs(avg) < 6 ? s.magFaint : s.magSlight;
      var bDir = avg > 0 ? s.brighterWord : s.darkerWord;
      return s.brightTemplate(bMag, bDir);
    }
    var diffs = [dr, dg, db];
    var absDiffs = [Math.abs(dr), Math.abs(dg), Math.abs(db)];
    var idx = absDiffs.indexOf(Math.max.apply(Math, absDiffs));
    var mag = absDiffs[idx] < 6 ? s.magFaint : s.magSlight;
    var labels = [[s.redWord, s.cyanWord], [s.greenWord, s.magentaWord], [s.blueWord, s.yellowWord]];
    var word = diffs[idx] > 0 ? labels[idx][0] : labels[idx][1];
    return s.hueTemplate(mag, word);
  }

  function bucketLabel(v, s) {
    if (v < 0x33) return s.bucketVeryDark;
    if (v < 0x66) return s.bucketDark;
    if (v < 0x99) return s.bucketMid;
    if (v < 0xCC) return s.bucketLight;
    return s.bucketVeryLight;
  }

  function showView(name) {
    Object.keys(els.views).forEach(function (k) {
      els.views[k].classList.toggle("active", k === name);
    });
  }

  function getBest(levelKey, total) {
    try {
      var raw = window.localStorage.getItem("colorquiz-best-" + levelKey);
      if (!raw) return null;
      var parsed = JSON.parse(raw);
      if (!parsed || typeof parsed.correct !== "number" || parsed.total !== total) return null;
      return parsed.correct;
    } catch (e) {
      return null;
    }
  }

  function setBest(levelKey, correct, total) {
    try {
      window.localStorage.setItem("colorquiz-best-" + levelKey, JSON.stringify({ correct: correct, total: total }));
    } catch (e) {
      /* storage unavailable, ignore */
    }
  }

  function buildLevelList() {
    els.levelList.innerHTML = "";
    LEVEL_ORDER.forEach(function (key) {
      var level = LEVELS[key];
      var card = document.createElement("button");
      card.type = "button";
      card.className = "level-card";

      var head = document.createElement("div");
      head.className = "level-head";
      var name = document.createElement("span");
      name.className = "level-name";
      name.textContent = levelLabel(key);
      var desc = document.createElement("span");
      desc.className = "level-desc";
      desc.textContent = levelDesc(key);
      head.appendChild(name);
      head.appendChild(desc);

      var swatchRow = document.createElement("div");
      swatchRow.className = "swatch-row";
      var previewColors = level.colors ? level.colors.slice(0, 3) : [generateRandomColor(), generateRandomColor(), generateRandomColor()];
      previewColors.forEach(function (c) {
        var sw = document.createElement("span");
        sw.className = "swatch";
        sw.style.background = c.hex;
        swatchRow.appendChild(sw);
      });

      card.appendChild(head);
      card.appendChild(swatchRow);
      card.addEventListener("click", function () { startLevel(key); });
      els.levelList.appendChild(card);
    });
  }

  function refreshStaticTexts() {
    var s = STRINGS[state.lang];
    document.title = s.title;
    els.gameTitle.textContent = s.title;
    els.gameSub.textContent = s.subtitle;
    els.langToggle.textContent = s.langToggle;
    els.quitBtn.textContent = s.back;
    els.retryBtn.textContent = s.retry;
    els.backBtn.textContent = s.chooseAnother;
    els.shareBtnLabel.textContent = s.share;
    els.footerPrivacy.textContent = s.footerPrivacy;
    els.footerAbout.textContent = s.footerAbout;
    buildLevelList();
  }

  function startLevel(key) {
    state.levelKey = key;
    var level = LEVELS[key];
    state.index = 0;
    state.firstTryCorrectCount = 0;
    var count = level.count;
    if (level.mode === "name") {
      state.questions = shuffle(level.colors).slice(0, count || level.colors.length);
    } else if (level.mode === "hexChoice") {
      state.questions = [];
      for (var i = 0; i < count; i++) {
        state.questions.push(generateHexChoiceQuestion());
      }
    } else if (level.mode === "swatch") {
      state.questions = [];
      for (var j = 0; j < count; j++) {
        state.questions.push(generateSwatchQuestion());
      }
    }
    showView("quiz");
    renderQuestion();
  }

  function renderQuestion() {
    state.isFirstAttemptOnThisQuestion = true;
    state.locked = false;
    var level = LEVELS[state.levelKey];
    var s = STRINGS[state.lang];
    var total = state.questions.length;
    var entry = state.questions[state.index];
    var displayHex = level.mode === "name" ? entry.hex : entry.target.hex;

    els.progressText.textContent = levelLabel(state.levelKey) + " ・ " + (state.index + 1) + " / " + total;
    els.colorSquare.style.background = displayHex;
    els.colorSquare.classList.remove("shake");
    els.squareLabel.classList.remove("show");
    els.feedback.className = "feedback";
    els.feedback.textContent = "";
    els.explainPanel.style.display = "none";

    if (level.mode === "swatch") {
      els.questionText.textContent = s.questionSwatch;
    } else if (level.mode === "hexChoice") {
      els.questionText.textContent = s.questionHex;
    } else {
      els.questionText.textContent = s.questionName;
    }

    if (level.mode === "hexChoice") {
      els.hintBtn.style.display = "inline-block";
      els.hintBtn.disabled = false;
      els.hintBtn.textContent = s.hintShow;
      els.hintText.classList.remove("show");
      els.hintText.textContent = "";
    } else {
      els.hintBtn.style.display = "none";
      els.hintText.classList.remove("show");
    }

    els.choices.style.display = "grid";
    renderChoices();
  }

  function renderChoices() {
    var level = LEVELS[state.levelKey];
    var s = STRINGS[state.lang];
    var entry = state.questions[state.index];
    var options = level.mode === "name" ? buildChoices(state.levelKey, entry) : entry.options;
    state.currentOptions = options;
    els.choices.innerHTML = "";
    options.forEach(function (opt) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "choice-btn";
      if (level.mode === "swatch") {
        btn.classList.add("choice-swatch");
        btn.style.background = opt.hex;
        btn.setAttribute("aria-label", s.optionAria);
      } else if (level.mode === "hexChoice") {
        btn.classList.add("choice-hex");
        btn.textContent = opt.hex;
      } else {
        btn.textContent = colorLabel(opt);
      }
      btn.addEventListener("click", function () { selectChoice(btn, opt); });
      els.choices.appendChild(btn);
    });
  }

  function prependMark(button, mark) {
    var iconSpan = document.createElement("span");
    iconSpan.className = "choice-text-mark";
    iconSpan.textContent = mark + " ";
    button.insertBefore(iconSpan, button.firstChild);
  }

  function buildSwatchReveal(mark, opt, current, s) {
    var wrap = document.createElement("span");
    wrap.className = "choice-reveal";
    var markEl = document.createElement("span");
    markEl.className = "choice-mark";
    markEl.textContent = mark;
    var info = document.createElement("span");
    info.className = "choice-info";
    var hexEl = document.createElement("span");
    hexEl.className = "choice-info-hex";
    hexEl.textContent = opt.hex;
    info.appendChild(hexEl);
    if (opt.hex !== current.hex) {
      var nameEl = document.createElement("span");
      nameEl.className = "choice-info-name";
      nameEl.textContent = relativeDescriptor(opt, current, s);
      info.appendChild(nameEl);
    }
    wrap.appendChild(markEl);
    wrap.appendChild(info);
    return wrap;
  }

  function selectChoice(button, chosen) {
    if (state.locked) return;
    var level = LEVELS[state.levelKey];
    var s = STRINGS[state.lang];
    var entry = state.questions[state.index];
    var current = level.mode === "name" ? entry : entry.target;
    var isCorrect = chosen.hex === current.hex;

    if (isCorrect) {
      state.locked = true;
      playCorrectSound();
      if (state.isFirstAttemptOnThisQuestion) state.firstTryCorrectCount++;
      button.classList.add("is-correct");
      if (level.mode === "swatch") {
        button.appendChild(buildSwatchReveal("✓", chosen, current, s));
      } else {
        prependMark(button, "✓");
      }
      Array.prototype.forEach.call(els.choices.children, function (b) { b.disabled = true; });
      els.feedback.className = "feedback show good";
      els.feedback.textContent = level.mode === "name" ? s.correctWithName(colorLabel(current)) : s.correctGeneric;
      showExplanation(level, current, entry);
    } else {
      state.isFirstAttemptOnThisQuestion = false;
      playWrongSound();
      button.classList.add("is-wrong");
      button.disabled = true;
      if (level.mode === "swatch") {
        button.appendChild(buildSwatchReveal("✗", chosen, current, s));
      } else {
        prependMark(button, "✗");
      }
      els.feedback.className = "feedback show bad";
      els.feedback.textContent = s.wrong;
      els.colorSquare.classList.remove("shake");
      void els.colorSquare.offsetWidth;
      els.colorSquare.classList.add("shake");
    }
  }

  function buildExplainOptionRow(o, isCorrectOpt, s, mode, current) {
    var row = document.createElement("div");
    row.className = "explain-option" + (isCorrectOpt ? " is-correct-opt" : "");
    var chip = document.createElement("span");
    chip.className = "explain-option-chip";
    chip.style.background = o.hex;
    var hexSpan = document.createElement("span");
    hexSpan.className = "explain-option-hex";
    hexSpan.textContent = (isCorrectOpt ? "★ " : "") + o.hex;
    row.appendChild(chip);
    row.appendChild(hexSpan);
    if (mode === "swatch") {
      if (!isCorrectOpt) {
        var nameSpan = document.createElement("span");
        nameSpan.className = "explain-option-name";
        nameSpan.textContent = relativeDescriptor(o, current, s);
        row.appendChild(nameSpan);
      }
    } else {
      var nameSpan2 = document.createElement("span");
      nameSpan2.className = "explain-option-name";
      var nearest = nearestColorName(o.hex);
      nameSpan2.textContent = nearest ? s.nearTo(colorLabel(nearest)) : "";
      row.appendChild(nameSpan2);
    }
    return row;
  }

  function showExplanation(level, current, entry) {
    var s = STRINGS[state.lang];
    els.explainChip.style.background = current.hex;
    els.explainHex.textContent = current.hex;
    els.explainOptions.innerHTML = "";
    els.explainOptions.classList.remove("show");
    els.explainText.style.display = "block";

    if (level.mode === "name") {
      els.explainName.textContent = colorLabel(current);
      els.explainText.textContent = (state.lang === "en" && current.info_en) ? current.info_en : (current.info || "");
    } else {
      els.explainText.style.display = "none";
      els.explainOptions.classList.add("show");
      els.explainName.textContent = level.mode === "hexChoice" ? s.hexCorrectLabel : s.swatchCorrectLabel;
      entry.options.forEach(function (o) {
        els.explainOptions.appendChild(buildExplainOptionRow(o, o.hex === current.hex, s, level.mode, current));
      });
    }

    if (level.mode === "swatch") {
      els.squareLabel.classList.add("show");
      els.slHex.textContent = current.hex;
      var nearestSelf = nearestColorName(current.hex);
      els.slName.textContent = nearestSelf ? s.nearTo(colorLabel(nearestSelf)) : "";
    }

    var isLast = state.index + 1 >= state.questions.length;
    els.explainNext.textContent = isLast ? s.seeResults : s.nextQuestion;

    els.explainPanel.style.display = "flex";
    els.explainPanel.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  function nextQuestion() {
    if (state.index + 1 < state.questions.length) {
      state.index++;
      renderQuestion();
    } else {
      finishLevel();
    }
  }

  function finishLevel() {
    var s = STRINGS[state.lang];
    var total = state.questions.length;
    var best = getBest(state.levelKey, total);
    if (best === null || state.firstTryCorrectCount > best) {
      setBest(state.levelKey, state.firstTryCorrectCount, total);
      best = state.firstTryCorrectCount;
    }
    state.resultBest = best;
    state.resultTotal = total;
    var ratio = total > 0 ? state.firstTryCorrectCount / total : 0;
    var phrase = ratio >= 1 ? s.resultPerfect : ratio >= 0.8 ? s.resultGreat : ratio >= 0.5 ? s.resultGood : s.resultTryAgain;
    els.resultTitle.textContent = s.resultTitleTemplate(levelLabel(state.levelKey), phrase);
    els.statFirstLabel.textContent = s.statFirstLabel;
    els.statFirst.textContent = state.firstTryCorrectCount + " / " + total;
    els.statBestLabel.textContent = s.statBestLabel;
    els.statBest.textContent = best + " / " + total;
    showView("result");
    playResultFanfare(ratio);
  }

  function shareResult() {
    var s = STRINGS[state.lang];
    var text = s.shareText(levelLabel(state.levelKey), state.resultBest, state.resultTotal);

    if (navigator.share) {
      navigator.share({ text: text }).catch(function () { /* user cancelled or unsupported */ });
      return;
    }
    window.open("https://twitter.com/intent/tweet?text=" + encodeURIComponent(text), "_blank", "noopener");
  }

  function buildHintMap(rgb, s) {
    var wrap = document.createElement("div");
    wrap.className = "hint-map";
    var channels = [
      { cls: "chip-r", label: s.hintPosR, val: bucketLabel(rgb.r, s) },
      { cls: "chip-g", label: s.hintPosG, val: bucketLabel(rgb.g, s) },
      { cls: "chip-b", label: s.hintPosB, val: bucketLabel(rgb.b, s) }
    ];
    channels.forEach(function (c) {
      var chip = document.createElement("div");
      chip.className = "hint-map-chip " + c.cls;
      var pos = document.createElement("span");
      pos.className = "pos";
      pos.textContent = c.label;
      var val = document.createElement("span");
      val.className = "val";
      val.textContent = c.val;
      chip.appendChild(pos);
      chip.appendChild(val);
      wrap.appendChild(chip);
    });
    return wrap;
  }

  els.hintBtn.addEventListener("click", function () {
    if (state.locked) return;
    var s = STRINGS[state.lang];
    var entry = state.questions[state.index];
    var rgb = hexToRgb(entry.target.hex);
    var showing = els.hintText.classList.toggle("show");
    if (showing) {
      els.hintText.innerHTML = "";
      els.hintText.appendChild(buildHintMap(rgb, s));
      var legend = document.createElement("div");
      legend.className = "hint-legend";
      legend.textContent = s.hintLegend;
      els.hintText.appendChild(legend);
      els.hintBtn.textContent = s.hintHide;
    } else {
      els.hintBtn.textContent = s.hintShow;
    }
  });

  els.langToggle.addEventListener("click", function () {
    state.lang = state.lang === "ja" ? "en" : "ja";
    try { window.localStorage.setItem("colorquiz-lang", state.lang); } catch (e) { /* ignore */ }
    refreshStaticTexts();
  });

  function updateMuteIcon() {
    els.muteToggle.textContent = state.muted ? "🔇" : "🔊";
    els.muteToggle.setAttribute("aria-label", state.muted ? "Unmute sound effects" : "Mute sound effects");
  }

  els.muteToggle.addEventListener("click", function () {
    state.muted = !state.muted;
    try { window.localStorage.setItem("colorquiz-muted", state.muted ? "1" : "0"); } catch (e) { /* ignore */ }
    updateMuteIcon();
  });

  els.explainNext.addEventListener("click", nextQuestion);
  els.quitBtn.addEventListener("click", function () { showView("title"); });
  els.retryBtn.addEventListener("click", function () { startLevel(state.levelKey); });
  els.shareBtn.addEventListener("click", shareResult);
  els.backBtn.addEventListener("click", function () { showView("title"); });

  refreshStaticTexts();
  updateMuteIcon();
})();
</script>
</body>
</html>
